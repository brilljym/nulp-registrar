<!DOCTYPE html>
<html>
<head>
    <title>API Test - Queue Position</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .response { background: #f5f5f5; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .highlight { background: yellow; font-weight: bold; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        pre { white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body>
    <h1>Queue API Test - Reference SR-20251104-0002 (A006)</h1>
    
    <button onclick="testAPI()">Test API</button>
    <button onclick="testKiosk()">Test Kiosk API (A006)</button>
    
    <div id="result"></div>
    
    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Loading...</p>';
            
            try {
                const response = await fetch('/api/transactions/reference/SR-20251104-0002');
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <div class="response">
                        <h2>API Response:</h2>
                        <p><strong>Queue Number:</strong> ${data.queue_number}</p>
                        <p><strong>Status:</strong> <span class="highlight">${data.status}</span></p>
                        <p><strong>Position:</strong> <span class="highlight">${data.position}</span></p>
                        <p><strong>Registrar ID:</strong> ${data.debug_info?.assigned_registrar_id}</p>
                        
                        <h3>Debug Info:</h3>
                        <p><strong>Raw Status:</strong> ${data.debug_info?.raw_status}</p>
                        <p><strong>Display Status:</strong> ${data.debug_info?.display_status}</p>
                        <p><strong>Is First:</strong> ${data.debug_info?.is_first}</p>
                        <p><strong>Position:</strong> ${data.debug_info?.position}</p>
                        <p><strong>Total for Registrar:</strong> ${data.debug_info?.total_requests_for_registrar}</p>
                        <p><strong>First Request ID:</strong> ${data.debug_info?.first_request_id}</p>
                        <p><strong>Current Request ID:</strong> ${data.debug_info?.current_request_id}</p>
                        
                        <h3>Full Response:</h3>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }
        
        async function testKiosk() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Loading...</p>';
            
            try {
                const response = await fetch('/api/kiosk/A006');
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <div class="response">
                        <h2>Kiosk API Response:</h2>
                        <p><strong>Queue Number:</strong> ${data.queue_number}</p>
                        <p><strong>Status:</strong> <span class="highlight">${data.status}</span></p>
                        <p><strong>Position:</strong> <span class="highlight">${data.position}</span></p>
                        <p><strong>Registrar ID:</strong> ${data.debug_info?.assigned_registrar_id}</p>
                        
                        <h3>Full Response:</h3>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
